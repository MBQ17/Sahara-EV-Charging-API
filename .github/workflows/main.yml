
name: Sahara EV Tariff Updater

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EV Scraper
        run: python scraper.py

      - name: Validate JSON
        run: |
          python -m json.tool data.json > /dev/null

      - name: Prepare Cloudflare Assets
        run: |
          mkdir -p public
          cp data.json public/data.json
          python -m json.tool public/data.json > /dev/null

      - name: Commit Updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json public/data.json

          git diff --cached --quiet || \
            git commit -m "Update EV charging rates"

          git push
